<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Boukkis</title>
<link rel="icon" href="favicon.ico" type="image/x-icon" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root {
  --bg: #0f172a;
  --card: #1e2a47;
  --primary: #3ddb6e;       /* bright green buttons */
  --secondary: #acbdd4;     /* slate blue accent */
  --text: #f0f4f8;
  --muted: #7a8a9e;
}

* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg, #020617, var(--bg));
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}
.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}
h1, h2 {
  margin: 16px 0;
  color: var(--secondary);
}
.card {
  background: var(--card);
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
}
.match {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.locked {
  opacity: 0.5;
}
.hidden {
  display: none;
}
input, select {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-size: 14px;
  background: #16213a;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
input::placeholder {
  color: var(--muted);
}
input:focus,
select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(61, 219, 110, 0.25);
}
button {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  background: var(--primary);
  color: #022c22;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.05s ease;
}
button:hover:not(:disabled) {
  background: #33c86f;
  transform: translateY(-1px);
}
button:active:not(:disabled) {
  transform: translateY(0);
}
button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 10px;
}
th {
  color: var(--secondary);
  text-align: left;
}
hr {
  border: none;
  border-top: 1px solid var(--card);
  margin: 30px 0;
}

/* User login overlay */
#userLoginOverlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
#userLoginBox {
  background: var(--card);
  padding: 30px 40px;
  border-radius: 16px;
  text-align: center;
  max-width: 320px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
}
#userLoginBox h2 {
  margin-bottom: 20px;
  color: var(--secondary);
}
#userLoginBox input {
  width: 100%;
  margin-bottom: 12px;
  font-size: 16px;
}
#userLoginBox button {
  width: 100%;
}
#userLoginError {
  color: #ff6b6b;
  margin-bottom: 12px;
  display: none;
  font-weight: 600;
}

/* Keep main container hidden initially */
#mainContainer.hidden {
  display: none;
}

#loader {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10000;
}
#loader.hidden {
  display: none;
}
.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid rgba(255, 255, 255, 0.2);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  margin-bottom: 12px;
}
.loader-text {
  color: var(--secondary);
  font-weight: 600;
  letter-spacing: 0.3px;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.match-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
/* Mobile layout fix */
@media (max-width: 600px) {
  .match {
    align-items: flex-start;
  }
  .match-actions {
    margin-left: auto;       /* pushes inputs to the right */
    justify-content: flex-end;
  }
  .match-actions input[type="number"] {
    width: 42px;
    text-align: center;
  }
}

#adminMatches > div {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.remove-match-btn {
  background: var(--primary);
  border: none;
  color: #022c22;
  cursor: pointer;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.2s ease, transform 0.1s ease;
  padding: 0;
}

.remove-match-btn:hover:not(:disabled) {
  background: #33c86f;
  transform: translateY(-2px);
}

.remove-match-btn:active:not(:disabled) {
  transform: translateY(0);
}

.remove-match-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

@media (max-width: 600px) {
  #historyTable thead th:nth-child(4),
  #historyTable tbody td:nth-child(4) {
    display: none;
  }
}

.status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  user-select: none;
  cursor: default;
}

.status.upcoming {
  background-color: #3b82f6; /* Blue-500 */
  color: white;
}

.status.inprogress {
  background-color: #f59e0b; /* Amber-500 */
  color: white;
}

.status.completed {
  background-color: #10b981; /* Emerald-500 */
  color: white;
}

.boosted-tag {
  display: inline-block;
  margin-left: 8px;
  padding: 3px 8px;
  background-color: #ef4444; /* red */
  color: white;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  user-select: none;
}

/* Style for the boosted checkbox label to match the boosted tag */
.boosted-label {
  display: inline-block;
  margin-left: 8px;
  padding: 3px 8px;
  background-color: #ef4444; /* same red as .boosted-tag */
  color: white;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  user-select: none;
  cursor: pointer;
  vertical-align: middle;
}

/* Optional: style the checkbox itself to better fit */
.boosted-checkbox {
  margin-left: 10px;
  vertical-align: middle;
  cursor: pointer;
  width: 16px;
  height: 16px;
  accent-color: #ef4444; /* modern CSS to color checkbox */
}

/* Container for the add match inputs and boosted */
#addMatchContainer {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin-bottom: 15px;
}

/* Inputs grow evenly */
#addMatchContainer input[type="text"],
#addMatchContainer input[type="datetime-local"] {
  flex: 1 1 150px;
  min-width: 150px;
  padding: 10px;
  border-radius: 8px;
}

/* Container for boosted checkbox + label */
#boostedContainer {
  display: flex;
  align-items: center;
  margin-left: 12px;
}

/* On mobile, stack boosted below datetime */
@media (max-width: 600px) {
  #addMatchContainer {
    flex-direction: column;
    align-items: stretch;
  }
  #boostedContainer {
    margin-left: 0;
    margin-top: 8px;
  }
}

tr.live-row {
  border-left: 4px solid #f59e0b; /* same amber as In Progress */
  background: rgba(245, 158, 11, 0.08);
}

#historyBody tr {
  transition: transform 0.25s ease, background-color 0.25s ease;
}

</style>
</head>
<body>

<!-- User Login Overlay -->
<div id="userLoginOverlay">
  <div id="userLoginBox">
    <h2>Enter User Password</h2>
    <input type="password" id="userPassInput" placeholder="User password" autocomplete="off" />
    <div id="userLoginError">Incorrect password, try again.</div>
    <button id="userLoginBtn">Login</button>
  </div>
</div>

<!-- Main app container hidden initially -->
<div id="mainContainer" class="hidden container">

<h1>⚽ Boukkis.cc ⚽</h1>

<button id="refreshBtn" style="margin-left: 12px; padding: 6px 12px; font-size: 14px; cursor: pointer;">
  🔄 Refresh
</button>

<br><br>

<h2>🤔 Submit Your Predictions</h2>
<div class="card">
  <label for="userSelect">Select User:</label>
  <select id="userSelect">
    <option value="" disabled selected>Select your username</option>
  </select>
</div>

<div id="matches"></div>

<div class="card">
  <button id="saveAllBtn" onclick="saveAllPredictions()">
    💾 Submit All
  </button>
</div>

<hr>

<h2>🏆 Leaderboard</h2>
<div class="card">
  <table>
    <thead><tr><th>USER</th><th>POINTS</th></tr></thead>
    <tbody id="leaderboard"></tbody>
  </table>
</div>

<hr>

<h2>🗒️ Predictions</h2>
<div class="card">
  <button id="defaultSortBtn" style="margin-bottom:10px;">⇅ Sort</button>
  <table id="historyTable">
    <thead>
      <tr>
        <th onclick="sortHistory('user')" style="cursor:pointer">USER ⬍</th>
        <th onclick="sortHistory('match')" style="cursor:pointer">MATCH ⬍</th>
        <th>SCORE</th>
        <th>TIME</th>
      </tr>
    </thead>
    <tbody id="historyBody"></tbody>
  </table>
</div>

<div style="margin-bottom: 12px;">
  <label>
    <input type="checkbox" id="toggleOldPredictions" />
    Show Archived
  </label>
</div>

<hr>

<h2>⚙️ Admin</h2>
<div id="login" class="card">
  <input id="adminPass" type="password" placeholder="Admin password" autocomplete="off" />
  <button onclick="login()">Login</button>
</div>

<div id="admin" class="hidden">

  <div class="card">
    <h3>Add User</h3>
    <input id="newUser" placeholder="Username" />
    <button onclick="addUser()">Add</button>
  </div>

  <div class="card">
    <h3>Add Match</h3>
    <div id="addMatchContainer">
      <input id="home" placeholder="Home team" />
      <input id="away" placeholder="Away team" />
      <input id="time" type="datetime-local" />
      <div id="boostedContainer">
        <input type="checkbox" id="boosted" class="boosted-checkbox" />
        <label for="boosted" class="boosted-label">Boosted</label>
      </div>
    </div>
    <button onclick="addMatch()">Add Match</button>
  </div>

  <div class="card">
    <h3>Delete Matches</h3>
    <div id="adminMatches"></div>
  </div>

  <div class="card">
    <h3>Set Match Result</h3>
    <select id="resultMatchSelect">
      <option value="" disabled selected>Select match</option>
    </select>
    <input id="resultHome" type="number" min="0" placeholder="Home goals" style="width:60px; margin-left:10px;" />
    <input id="resultAway" type="number" min="0" placeholder="Away goals" style="width:60px; margin-left:5px;" />
    <button onclick="setResult()">Save Result</button>
  </div>

</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzRYls8N13HeCqOmqjbSjYdUQGSHXeMZYa0etEbfFIW9MV6oQLsEq8ouA5G-KrzAHk8/exec";

let pendingPredictions = {};
let historySortMode = 'default'; // 'default' | 'user' | 'match'
let historySortAsc = true;

let globalData = {
  users: [],
  matches: [],
  predictions: [],
  results: []
};

function showLoader(text = 'Loading…') {
  document.querySelector('#loader .loader-text').textContent = text;
  document.getElementById('loader').classList.remove('hidden');
}

function hideLoader() {
  document.getElementById('loader').classList.add('hidden');
}

function sortHistory(column) {
  if (historySortMode === column) {
    historySortAsc = !historySortAsc;
  } else {
    historySortMode = column;
    historySortAsc = true;
  }

  renderHistory(
    globalData.predictions,
    globalData.matches,
    document.getElementById('toggleOldPredictions').checked
  );
}

/* Helper to POST form-urlencoded data */
function post(data) {
  const formData = new URLSearchParams();
  for (const key in data) {
    formData.append(key, data[key]);
  }
  return fetch(API_URL, {
    method: 'POST',
    body: formData,
  }).then(r => r.json());
}

/* Load all data */
async function load() {
  showLoader('Loading data…');
  const data = await fetch(API_URL + "?action=data").then(r => r.json());
  globalData.users = data.users || [];
  globalData.matches = data.matches || [];
  globalData.results = data.results || [];  // load results too

  // Load predictions separately (for history)
  try {
    const predRes = await fetch(API_URL + "?action=predictions");
    const predData = await predRes.json();
    globalData.predictions = predData.predictions || [];
  } catch {
    globalData.predictions = [];
  }

  renderUserSelect(globalData.users, false);
  renderMatches(globalData.matches);
  renderLeaderboard(globalData.users);
  renderAdminMatches(globalData.matches);
  renderHistory(globalData.predictions, globalData.matches, false);
  renderResultMatchSelect(globalData.matches, globalData.results);
  hideLoader();
}


/* Render user dropdown */
function renderUserSelect(users, keepSelection = false) {
  const select = document.getElementById('userSelect');
  let currentValue = keepSelection ? select.value : '';

  select.innerHTML = '<option value="" disabled selected>Select your username</option>';
  users.forEach(u => {
    const selected = (u[0] === currentValue) ? 'selected' : '';
    select.innerHTML += `<option value="${u[0]}" ${selected}>${u[0]}</option>`;
  });

  if (!keepSelection) {
    select.value = '';
  }
}

/* Listen for user selection to save */
document.getElementById('userSelect').addEventListener('change', function() {
  localStorage.setItem('selectedUser', this.value);
});



/* Render matches for predictions */
function renderMatches(matches) {
  const el = document.getElementById('matches');
  el.innerHTML = '';
  const now = new Date();

  // Map predictions by user and match for quick lookup
  const user = document.getElementById('userSelect').value;
  const userPredictions = {};
  globalData.predictions.forEach(p => {
    if(p[1] === user) userPredictions[p[0]] = p;
  });

  matches.forEach(m => {
    const kickoff = new Date(m[3]);
    const kickoffEnd = new Date(kickoff.getTime() + 120*60000); // +120 mins
    const nowTime = now.getTime();
    let status = '';
    if (nowTime < kickoff.getTime()) status = 'Upcoming';
    else if (nowTime >= kickoff.getTime() && nowTime <= kickoffEnd.getTime()) status = 'In Progress';
    else status = 'Completed';

    // Hide completed from prediction list
    if(status === 'Completed') return;

    const locked = now >= kickoff;
    const div = document.createElement('div');
    div.className = 'card match' + (locked ? ' locked' : '');

    // get user's prediction if any
    const pred = userPredictions[m[0]];
    const predH = pred ? pred[2] : '';
    const predA = pred ? pred[3] : '';

    // Check if boosted column exists and is 'T'
    const isBoosted = (m.length > 4 && m[4] === 'T');

    div.innerHTML = `
      <div>
        <strong>${m[1]} vs ${m[2]}</strong> 
        <small style="display:block; color: var(--muted);">${kickoff.toLocaleString(undefined, {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small>
        <span class="status ${status.toLowerCase().replace(' ', '')}">${status}</span>
        ${isBoosted ? '<span class="boosted-tag">Boosted</span>' : ''}
      </div>
      <div class="match-actions">
        <input id="h-${m[0]}" type="number" min="0"
          ${locked ? 'disabled' : ''}
          style="width:45px"
          value="${predH}"
          oninput="queuePrediction(${m[0]})"
        />
        -
        <input id="a-${m[0]}" type="number" min="0"
          ${locked ? 'disabled' : ''}
          style="width:45px"
          value="${predA}"
          oninput="queuePrediction(${m[0]})"
        />
      </div>
    `;
    el.appendChild(div);
  });
}

function queuePrediction(matchId) {
  const h = document.getElementById(`h-${matchId}`).value;
  const a = document.getElementById(`a-${matchId}`).value;

  if (h === '' || a === '') return;

  pendingPredictions[matchId] = { h, a };
}

/* Render leaderboard */
function renderLeaderboard(users) {
  const el = document.getElementById('leaderboard');
  el.innerHTML = '';
  // Sort descending by points
  users.sort((a,b) => b[1] - a[1]).forEach(u => {
    el.innerHTML += `<tr><td>${u[0]}</td><td>${u[1]}</td></tr>`;
  });
}

/* Render matches for admin to manage */
function renderAdminMatches(matches) {
  const el = document.getElementById('adminMatches');
  el.innerHTML = '';
  const now = new Date();
  matches.forEach(m => {
    const kickoff = new Date(m[3]);
    const kickoffStr = kickoff.toLocaleString(undefined, {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const disableDelete = now >= kickoff ? 'disabled' : '';
    const div = document.createElement('div');
    div.innerHTML = `
      <span>${m[1]} vs ${m[2]} — <small style="color: var(--muted);">${kickoffStr}</small></span>
      <button class="remove-match-btn" onclick="removeMatch(${m[0]})" ${disableDelete} title="${disableDelete ? 'Cannot delete match after kickoff' : ''}">ⓧ</button>
    `;
    el.appendChild(div);
  });
}

/* Render prediction history */
function renderHistory(predictions, matches, showAll = false) {
  const tbody = document.getElementById('historyBody');
  tbody.innerHTML = '';

  const matchMap = {};
  matches.forEach(m => matchMap[m[0]] = m);

  const now = new Date();

  function getStatus(match) {
    const kickoff = new Date(match[3]);
    const kickoffEnd = new Date(kickoff.getTime() + 120 * 60000);
    if (now < kickoff) return 'Upcoming';
    if (now >= kickoff && now <= kickoffEnd) return 'In Progress';
    return 'Completed';
  }

  function statusRank(status) {
    if (status === 'In Progress') return 1;
    if (status === 'Completed') return 2;
    return 3;
  }

  let filtered = predictions.filter(p => {
    const match = matchMap[p[0]];
    if (!match) return false;

    const kickoff = new Date(match[3]);
    const kickoffEnd = new Date(kickoff.getTime() + 120 * 60000);

    if (!showAll && now > new Date(kickoffEnd.getTime() + 24 * 60 * 60000)) {
      return false;
    }
    return true;
  });

  // DEFAULT SORT
  if (historySortMode === 'default') {
    filtered.sort((a, b) => {
      const ma = matchMap[a[0]];
      const mb = matchMap[b[0]];

      const sa = getStatus(ma);
      const sb = getStatus(mb);

      const r = statusRank(sa) - statusRank(sb);
      if (r !== 0) return r;

      const nameA = ma[1] + ' vs ' + ma[2];
      const nameB = mb[1] + ' vs ' + mb[2];
      return nameA.localeCompare(nameB);
    });
  }

  // USER SORT
  if (historySortMode === 'user') {
    filtered.sort((a,b) => historySortAsc
      ? a[1].localeCompare(b[1])
      : b[1].localeCompare(a[1])
    );
  }

  // MATCH SORT
  if (historySortMode === 'match') {
    filtered.sort((a,b) => {
      const ma = matchMap[a[0]];
      const mb = matchMap[b[0]];
      const nameA = ma[1] + ' vs ' + ma[2];
      const nameB = mb[1] + ' vs ' + mb[2];
      return historySortAsc
        ? nameA.localeCompare(nameB)
        : nameB.localeCompare(nameA);
    });
  }

  filtered.forEach(p => {
    const match = matchMap[p[0]];
    if (!match) return;

    const kickoff = new Date(match[3]);
    const kickoffEnd = new Date(kickoff.getTime() + 120 * 60000);

    let status = '';
    if (now < kickoff) status = 'Upcoming';
    else if (now >= kickoff && now <= kickoffEnd) status = 'In Progress';
    else status = 'Completed';

    const isBoosted = (match.length > 4 && match[4] === 'T');

    const dt = new Date(p[4]);
    const timeStr = dt.toLocaleString(undefined, {
      year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'
    });

    const tr = document.createElement('tr');
    if (status === 'In Progress') tr.classList.add('live-row');

    tr.innerHTML = `
      <td>${p[1]}</td>
      <td>
        ${match[1]} vs ${match[2]}<br/>
        <span class="status ${status.toLowerCase().replace(' ', '')}">${status}</span>
        ${isBoosted ? '<span class="boosted-tag">Boosted</span>' : ''}
      </td>
      <td>${p[2]} - ${p[3]}</td>
      <td>${timeStr}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('defaultSortBtn').addEventListener('click', () => {
  historySortMode = 'default';
  renderHistory(globalData.predictions, globalData.matches, document.getElementById('toggleOldPredictions').checked);
});

document.getElementById('toggleOldPredictions').addEventListener('change', function() {
  renderHistory(globalData.predictions, globalData.matches, this.checked);
});

/* User prediction */
function predict(id) {
  const userSelect = document.getElementById('userSelect');
  const user = userSelect.value;
  if (!user) {
    alert("Please select your username");
    return;
  }
  const hInput = document.getElementById(`h-${id}`);
  const aInput = document.getElementById(`a-${id}`);
  const h = hInput.value;
  const a = aInput.value;
  if (h === '' || a === '') {
    alert("Please enter both scores");
    return;
  }
  post({ action: 'predict', matchId: id, user, h, a }).then(() => {
    // After saving, refresh predictions & users for leaderboard & history
    Promise.all([
      fetch(API_URL + "?action=predictions").then(r => r.json()),
      fetch(API_URL + "?action=data").then(r => r.json())
    ]).then(([predData, data]) => {
      globalData.predictions = predData.predictions || [];
      globalData.users = data.users || [];
      renderLeaderboard(globalData.users);
      renderHistory(globalData.predictions, globalData.matches);
      // Do NOT reload matches so input fields keep current values
    });
  });
}

async function saveAllPredictions() {
  const user = document.getElementById('userSelect').value;
  if (!user) {
    alert("Please select your username");
    return;
  }

  const entries = Object.entries(pendingPredictions);
  if (!entries.length) {
    alert("No predictions to save");
    return;
  }

  const btn = document.getElementById('saveAllBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  showLoader('Submitting predictions…');

  for (const [matchId, score] of entries) {
    await post({
      action: 'predict',
      matchId,
      user,
      h: score.h,
      a: score.a
    });
  }

  pendingPredictions = {};

  // Refresh once
  const [predData, data] = await Promise.all([
    fetch(API_URL + "?action=predictions").then(r => r.json()),
    fetch(API_URL + "?action=data").then(r => r.json())
  ]);

  globalData.predictions = predData.predictions || [];
  globalData.users = data.users || [];

  renderLeaderboard(globalData.users);
  renderHistory(globalData.predictions, globalData.matches);
  renderUserSelect(globalData.users, true);

  btn.disabled = false;
  btn.textContent = '💾 Submit All';

  alert("Predictions saved!");
  hideLoader();
}

/* When user changes, pre-fill predictions */
document.getElementById('userSelect').addEventListener('change', () => {
  showLoader('Loading predictions…');
  localStorage.setItem('selectedUser', document.getElementById('userSelect').value);
  renderMatches(globalData.matches);
  hideLoader();
});

/* Admin login */
function login() {
  const passInput = document.getElementById('adminPass');
  post({ action: 'login', password: passInput.value })
    .then(r => {
      if (r.ok) {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('admin').classList.remove('hidden');
        load();
      } else {
        alert("Wrong password");
      }
    });
}

/* Add user */
function addUser() {
  showLoader('Saving user…');
  const newUser = document.getElementById('newUser');
  if (!newUser.value) return alert("Enter username");
  post({ action: 'addUser', user: newUser.value }).then(() => {
    newUser.value = '';
    load();
  });
  hideLoader();
}

/* Add match */
function addMatch() {
  showLoader('Adding match…');
  const home = document.getElementById('home');
  const away = document.getElementById('away');
  const time = document.getElementById('time');
  const boosted = document.getElementById('boosted').checked ? 'T' : 'F';
  if (!home.value || !away.value || !time.value) return alert("Fill all match fields");

  post({ 
    action: 'addMatch', 
    home: home.value, 
    away: away.value, 
    kickoff: time.value,
    boosted 
  }).then(() => {
    home.value = '';
    away.value = '';
    time.value = '';
    document.getElementById('boosted').checked = false;
    load();
    hideLoader();
  });
}

/* Remove match */
function removeMatch(id) {
  if (!confirm("Remove this match?")) return;
  // Check kickoff time - prevent delete if passed
  const match = globalData.matches.find(m => m[0] == id);
  if (!match) return alert("Match not found");
  if (new Date(match[3]) <= new Date()) {
    alert("Cannot delete match after kickoff time");
    return;
  }
  showLoader('Deleting match…');
  post({ action: 'removeMatch', id }).then(load);
  hideLoader();
}

function renderResultMatchSelect(matches, results) {
  const select = document.getElementById('resultMatchSelect');
  const currentValue = select.value;
  const now = new Date();
  select.innerHTML = '<option value="" disabled>Select match</option>';

  // Make a Set of matchIds that already have results
  const matchesWithResults = new Set(results.map(r => r[0].toString()));

  matches.forEach(m => {
    const kickoff = new Date(m[3]);
    const matchIdStr = m[0].toString();
    // Only if kickoff passed AND no result exists yet
    if (now >= kickoff && !matchesWithResults.has(matchIdStr)) {
      const label = `${m[1]} vs ${m[2]} (${kickoff.toLocaleString(undefined, {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})})`;
      const selected = (matchIdStr === currentValue) ? 'selected' : '';
      select.innerHTML += `<option value="${m[0]}" ${selected}>${label}</option>`;
    }
  });
}

/* Save match result */
function setResult() {
  const matchSelect = document.getElementById('resultMatchSelect');
  const h = document.getElementById('resultHome').value;
  const a = document.getElementById('resultAway').value;
  const matchId = matchSelect.value;

  if (!matchId) return alert("Select a match");
  if (h === '' || a === '') return alert("Enter both home and away goals");

  post({ action: 'result', matchId, h, a }).then(() => {
    showLoader('Saving result…');
    // Clear inputs after saving result
    matchSelect.value = '';
    document.getElementById('resultHome').value = '';
    document.getElementById('resultAway').value = '';
    load();
    hideLoader();
  });
}

/* Check user password via API */
async function checkUserPassword(password) {
  try {
    const res = await post({ action: 'userLogin', password });
    return res.ok === true;
  } catch {
    return false;
  }
}

/* User login overlay elements */
const userLoginOverlay = document.getElementById('userLoginOverlay');
const userPassInput = document.getElementById('userPassInput');
const userLoginBtn = document.getElementById('userLoginBtn');
const userLoginError = document.getElementById('userLoginError');

userLoginBtn.onclick = async () => {
  const pass = userPassInput.value.trim();
  if (!pass) {
    alert("Please enter user password");
    return;
  }
  userLoginError.style.display = 'none';
  userLoginBtn.disabled = true;

  const valid = await checkUserPassword(pass);

  userLoginBtn.disabled = false;

  if (valid) {
    // Hide login overlay
    userLoginOverlay.style.display = 'none';
    // Show main container
    document.getElementById('mainContainer').classList.remove('hidden');

    // Restore scrolling and height on body
    document.body.style.overflow = 'auto';
    document.body.style.height = 'auto';

    load();
  } else {
    userLoginError.style.display = 'block';
    userPassInput.value = '';
    userPassInput.focus();
  }
};

/* Press Enter key on user password input triggers login */
userPassInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    userLoginBtn.click();
  }
});

document.getElementById('adminPass').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    login();
  }
});

document.getElementById('refreshBtn').addEventListener('click', () => {
  showLoader('Reloading data…');
  load().then(() => {
    hideLoader();
  });
});

</script>

  <div class="spinner"></div>
  <div class="loader-text">Loading…</div>
</div>
</body>
